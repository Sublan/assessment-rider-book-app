# One-command local stack: MySQL + Laravel (PHP-FPM) + Reverb (WebSocket) + nginx serving the SPA.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The APP_KEY below is a throwaway demo key committed on purpose so the stack
# boots without setup; every real environment must set its own (see README).
name: ridebook

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ridebook
      MYSQL_ROOT_PASSWORD: ridebook
    ports:
      # Host port 3307 so it does not collide with a locally installed MySQL.
      - '3307:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pridebook']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: RideBook
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: 'base64:pdusPAxeiH3AH+AmAFNDf6DhRPAqrOyWNUwG8nbslus='
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: ridebook
      DB_USERNAME: root
      DB_PASSWORD: ridebook
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: '423134'
      REVERB_APP_KEY: zyclntl4jofon7wbb3aw
      REVERB_APP_SECRET: sekc4pl26ze0fkvzyhbr
      REVERB_HOST: reverb
      REVERB_PORT: '8080'
      REVERB_SCHEME: http
      RIDE_DEFAULT_CITY: Lahore
      # Seed the demo riders/drivers on first boot so the app is usable straight away.
      SEED_DEMO: 'true'
    expose:
      - '9000'

  reverb:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: RideBook
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: 'base64:pdusPAxeiH3AH+AmAFNDf6DhRPAqrOyWNUwG8nbslus='
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: ridebook
      DB_USERNAME: root
      DB_PASSWORD: ridebook
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: '423134'
      REVERB_APP_KEY: zyclntl4jofon7wbb3aw
      REVERB_APP_SECRET: sekc4pl26ze0fkvzyhbr
      REVERB_HOST: '0.0.0.0'
      REVERB_PORT: '8080'
      REVERB_SCHEME: http
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      # Skip migrations — the api container handles them.
      RUN_MIGRATIONS: 'false'
      SEED_DEMO: 'false'
    expose:
      - '8080'
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - reverb
    ports:
      - '8080:80'

volumes:
  db-data:
